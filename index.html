<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5747c8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Learning Garden">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" href="./icon-192.png">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="home.css">
<title>Learning Garden</title><meta name="description" content="Choose a learner and grow with spelling and math practice.">
</head><body><main class="shell">
<header class="top"><div class="brand"><i aria-hidden="true">🌼</i> Learning Garden</div><a class="pill" href="parents.html">⚙️ Grown-ups</a></header>
<div class="hero homeHero"><div class="eyebrow">Welcome to your garden</div><h1>Ready to grow?</h1><p class="muted">Choose your name to start spelling. See how much you’ve grown!</p></div>
<section aria-labelledby="learnerTitle"><h2 id="learnerTitle">Choose your learner</h2><div id="learners" class="learnerGrid"></div></section>
<div class="footer">Little steps make big gardens ✨</div>
</main><script src="common.js"></script><script>
function renderHome(){const box=document.getElementById('learners');box.replaceChildren();data.profiles.forEach(p=>{const button=document.createElement('button');button.className='learnerCard'+(p.id===current().id?' active':'');button.setAttribute('aria-label',`Start Spell Sprout as ${p.name}. Best spelling streak ${p.bestStreak||0}, best math streak ${p.mathBestStreak||0}. Perfect spelling rounds ${p.spellingPerfectRounds||0}, perfect math rounds ${p.mathPerfectRounds||0}.`);const name=document.createElement('span');name.className='learnerName';name.textContent='🌿 '+p.name;const label=document.createElement('span');label.className='bestLabel';label.textContent=`${p.name}’s Best Streaks!`;const scores=document.createElement('span');scores.className='bestScores';const spell=document.createElement('span');spell.textContent='🌱 Spelling  '+(p.bestStreak||0);const math=document.createElement('span');math.textContent='🔢 Math  '+(p.mathBestStreak||0);scores.append(spell,math);const trophy=document.createElement('span');trophy.className='trophyTitle';trophy.textContent='🏆 Perfect rounds';const perfect=document.createElement('span');perfect.className='bestScores';const spellPerfect=document.createElement('span');spellPerfect.textContent='🌱 Spelling  '+(p.spellingPerfectRounds||0);const mathPerfect=document.createElement('span');mathPerfect.textContent='🔢 Math  '+(p.mathPerfectRounds||0);perfect.append(spellPerfect,mathPerfect);button.append(name,label,scores,trophy,perfect);button.onclick=()=>{data.active=p.id;save();location.href='spelling.html'};box.append(button)})}
renderHome();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
