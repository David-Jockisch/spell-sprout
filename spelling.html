<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5646c8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Learning Garden"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><title>Spell Sprout · Learning Garden</title><meta name="description" content="Listen, build, and practice spelling words."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%235646c8'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='43'%3E%F0%9F%8C%BC%3C/text%3E%3C/svg%3E"><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#26304b;background:#f4f3ff}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f5a623;outline-offset:3px}.shell{max-width:980px;margin:auto;padding:18px 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.35rem;color:#4837b4}.brand i{font-style:normal;background:#ded9ff;border-radius:14px;padding:9px}.pill{border:2px solid #ddd9f4;border-radius:999px;background:white;color:#4837b4;font-weight:800;padding:10px 14px}.hero{margin:25px 0 17px}.eyebrow{font-size:.88rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#6555b6}h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.12;margin:7px 0}p{line-height:1.5}.muted{color:#626b80}.profiles{display:flex;gap:9px;overflow:auto;padding:3px 0 10px}.profile{flex:none;border:2px solid #e0dcf5;background:#fff;border-radius:18px;padding:12px 16px;color:#3b4059;font-weight:900;min-height:53px}.profile.active{background:#5747c8;border-color:#5747c8;color:white}.card{background:white;border-radius:26px;box-shadow:0 10px 35px #3e32841a;padding:20px;margin:14px 0}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{background:#e6f8ee;color:#176842;border-radius:999px;padding:7px 11px;font-weight:900;font-size:.85rem}.prompt{text-align:center;padding:9px 0 2px}.prompt .label{font-weight:800;color:#646983}.prompt h2{font-size:clamp(2rem,9vw,3.3rem);margin:9px 0;color:#352c86}.hint{font-size:.95rem;margin:4px 0 20px;color:#626b80}.slots,.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;min-height:54px}.slot,.tile{width:clamp(42px,11vw,58px);height:clamp(51px,13vw,62px);border-radius:14px;display:grid;place-items:center;font-size:1.55rem;font-weight:900;touch-action:none}.slot{border:2px dashed #b9b1ec;background:#f5f3ff;color:#3e348f}.slot.filled{border:2px solid #5747c8;background:#e6e2ff}.letters{padding:22px 0 8px}.tile{border:0;background:#ffce62;color:#3f355d;box-shadow:0 5px 0 #e7a93d}.tile.selected{background:#fa9c66;box-shadow:0 5px 0 #d6733a;transform:translateY(-2px)}.tile.used{visibility:hidden}.instruction{text-align:center;color:#666b7e;font-weight:700;font-size:.9rem;margin:4px 0}.actions{display:flex;gap:10px;margin-top:23px}.primary,.secondary{border:0;border-radius:15px;min-height:51px;padding:12px 18px;font-weight:900}.primary{background:#5747c8;color:white;flex:1}.secondary{background:#eeeafd;color:#493ba8}.hear{display:block;width:min(100%,340px);margin:0 auto 20px;padding:16px 22px;min-height:72px;border:0;border-radius:22px;background:#ffcc58;color:#332660;font-size:1.27rem;font-weight:900;box-shadow:0 6px 0 #e6a83a;touch-action:manipulation}.hear:active{transform:translateY(3px);box-shadow:0 3px 0 #e6a83a}.streak{background:#fff0cb;color:#79500b;border-radius:999px;padding:9px 13px;font-size:.92rem;font-weight:900;white-space:nowrap}.feedback{min-height:27px;text-align:center;font-weight:900;margin:13px 0 0}.feedback.good{color:#168153}.feedback.try{color:#b45a21}.sectionTitle{font-size:1.3rem;margin:4px 0 8px}.small{font-size:.88rem}.progress{height:11px;border-radius:20px;background:#ebe9fa;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:#5cc695;border-radius:20px}.manage{display:none}.manage.open{display:block}.formrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0}.field{width:100%;border:2px solid #ddd9ef;border-radius:14px;padding:12px;background:white;min-width:0}.list{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.chip{display:inline-flex;align-items:center;gap:5px;background:#eeeafd;border-radius:999px;padding:8px 10px;font-weight:800}.chip button{border:0;background:transparent;color:#654ebc;font-size:1.2rem;line-height:1}.danger{color:#a63e4d}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.empty{text-align:center;padding:25px;color:#626b80}.footer{text-align:center;color:#767b90;font-size:.83rem;padding-top:15px}textarea{min-height:118px;resize:vertical}.profileManage{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0}.hidden{display:none!important}@media(min-width:720px){.shell{padding:28px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,.8fr);gap:18px;align-items:start}.layout .card{margin:0}.hero{margin:34px 0 20px}.card{padding:27px}.letters{gap:12px}}@media(max-width:400px){.card{padding:16px}.slot,.tile{width:39px;height:49px;font-size:1.35rem;gap:5px}}
.subjectNav{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}.subjectNav a{flex:none;text-decoration:none;color:#493ba8;background:white;border:2px solid #e0dcf5;border-radius:999px;padding:11px 14px;font-weight:900;min-height:47px}.subjectNav a.active{background:#5747c8;color:white;border-color:#5747c8}</style></head><body><main class="shell"><header class="top"><div class="brand"><i aria-hidden="true">🌼</i> Learning Garden</div><a class="pill" href="parents.html">⚙️ Grown-up corner</a></header><nav class="subjectNav" aria-label="Subjects"><a href="index.html">🌼 Home</a><a class="active" href="spelling.html">🌱 Spell Sprout</a><a href="math.html">🔢 Math Meadow</a><a href="grammar.html">✏️ Grammar Grove</a></nav><div class="hero"><div class="eyebrow">Spelling practice</div><h1>Let’s grow your word power!</h1><p class="muted" style="margin:5px 0">Choose your name, listen, and build the word.</p></div><nav class="profiles" id="profiles" aria-label="Choose a learner"></nav><section class="card" id="game"><div class="bar"><span class="tag" id="weekCount">Weekly practice</span><span class="streak" id="streak">🔥 0 streak</span></div><div id="playArea"></div><div class="small muted" id="score" style="text-align:center;margin-top:12px"></div><div class="progress" aria-hidden="true"><span id="progressFill"></span></div><div style="text-align:center;margin-top:17px"><button class="secondary" id="restart">Practice again ↻</button></div></section><div class="footer">Made for little hands and growing minds ✨</div></main><script>
const KEY='spell-sprout-v1';
const defaults={profiles:[{id:'one',name:'First grader',words:['cat','ship','duck','quick','sock'],done:[]},{id:'three',name:'Third grader',words:['garden','bright','window','pencil','favorite'],done:[]}],active:'one'};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{data=structuredClone(defaults)}
if(!Array.isArray(data.profiles)||!data.profiles.length)data=structuredClone(defaults);
let index=0,placed=[],pool=[],feedback='',feedbackType='';
const $=id=>document.getElementById(id),current=()=>data.profiles.find(p=>p.id===data.active)||data.profiles[0];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makePool(word){const alphabet='abcdefghijklmnopqrstuvwxyz';let extras=[];const target=Math.min(4,Math.max(2,Math.ceil(word.length/3)));while(extras.length<target){let c=alphabet[Math.floor(Math.random()*26)];if(!word.includes(c)&&!extras.includes(c))extras.push(c)}return shuffle([...word,...extras].map((letter,i)=>({letter,id:crypto.randomUUID?crypto.randomUUID():String(i)+Math.random()})))}
function speak(word){if(!('speechSynthesis' in window)){alert('Speech is not available in this browser. Ask a grown-up to try another browser.');return}speechSynthesis.cancel();let p=current(),u=new SpeechSynthesisUtterance((p.pronunciations||{})[word]||word);u.rate=Number(data.speechRate)||.75;let voice=speechSynthesis.getVoices().find(v=>v.name===data.voiceName&&v.lang===data.voiceLang);if(voice)u.voice=voice;speechSynthesis.speak(u)}
const soundFiles={good:'./correct.wav',try:'./try-again.wav'};const soundPlayers={};
function playEffect(kind){if(data.soundEffects===false)return;if('audioSession' in navigator)try{navigator.audioSession.type='playback'}catch{}let player=soundPlayers[kind]||(soundPlayers[kind]=new Audio(soundFiles[kind]));player.pause();player.currentTime=0;player.play().catch(()=>{});}
function resetWord(){placed=[];feedback='';feedbackType='';let p=current();if(index>=p.words.length)index=0;if(p.words.length)pool=makePool(p.words[index]);render()}
function render(){let p=current();data.active=p.id;$('profiles').replaceChildren();data.profiles.forEach(profile=>{let b=document.createElement('button');b.className='profile'+(profile.id===p.id?' active':'');b.textContent=profile.name;b.onclick=()=>{data.active=profile.id;index=0;save();resetWord()};$('profiles').append(b)});let count=p.words.length,done=p.words.filter(w=>p.done.includes(w)).length;$('weekCount').textContent=count+' weekly word'+(count===1?'':'s');$('score').textContent=count?done+' practiced · Best streak: '+(p.bestStreak||0):'';$('streak').textContent='🔥 '+(p.streak||0)+' streak';$('progressFill').style.width=(count?done/count*100:0)+'%';let area=$('playArea');area.replaceChildren();if(!count){area.innerHTML='<div class="empty">Your word garden is empty. Ask a grown-up to add this week’s words! 🌼</div>';return}let word=p.words[index];let prompt=document.createElement('div');prompt.className='prompt';prompt.innerHTML='<div class="label">Word '+(index+1)+' of '+count+'</div><h2>Build the word</h2><p class="hint">Listen first, then pick its letters.</p>';let hear=document.createElement('button');hear.className='hear';hear.textContent='🔊 Tap to hear your word';hear.onclick=()=>speak(word);prompt.append(hear);area.append(prompt);
let slots=document.createElement('div');slots.className='slots';slots.setAttribute('aria-label','Word slots');for(let i=0;i<word.length;i++){let tile=document.createElement('button');tile.className='slot'+(placed[i]!=null?' filled':'');tile.textContent=placed[i]!=null?pool[placed[i]].letter.toUpperCase():' ';tile.setAttribute('aria-label',placed[i]!=null?'Remove '+pool[placed[i]].letter+' from position '+(i+1):'Empty position '+(i+1));tile.onclick=()=>{if(placed[i]!=null&&feedbackType!=='good'){placed[i]=null;feedback='';feedbackType='';render()}};tile.ondragover=e=>e.preventDefault();tile.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain'),idx=pool.findIndex(t=>t.id===id);if(feedbackType!=='good'&&idx>=0&&!placed.includes(idx)){placed[i]=idx;feedback='';feedbackType='';render()}};slots.append(tile)}area.append(slots);let note=document.createElement('p');note.className='instruction';note.textContent='Tap letters in order, or drag them into the spaces.';area.append(note);let letters=document.createElement('div');letters.className='letters';pool.forEach((t,i)=>{let tile=document.createElement('button');tile.className='tile'+(placed.includes(i)?' used':'');tile.textContent=t.letter.toUpperCase();tile.setAttribute('aria-label','Letter '+t.letter);tile.draggable=true;tile.ondragstart=e=>e.dataTransfer.setData('text/plain',t.id);tile.onclick=()=>{if(placed.includes(i)||feedbackType==='good')return;let empty=placed.findIndex(v=>v==null);if(empty<0)empty=placed.length;if(empty>=word.length)return;placed[empty]=i;feedback='';feedbackType='';render()};letters.append(tile)});area.append(letters);
let actions=document.createElement('div');actions.className='actions';let undo=document.createElement('button');undo.className='secondary';undo.textContent='Undo';undo.disabled=feedbackType==='good';undo.onclick=()=>{let last=placed.findLastIndex(v=>v!=null);if(last>=0)placed[last]=null;feedback='';feedbackType='';render()};let check=document.createElement('button');check.className='primary';check.textContent=feedbackType==='good'?'Next word →':'Check word';check.onclick=()=>{if(feedbackType==='good'){index=(index+1)%p.words.length;resetWord();return}if(Array.from({length:word.length},(_,i)=>placed[i]).some(v=>v==null)){feedback='Fill every space first!';feedbackType='try'}else if(placed.map(i=>pool[i].letter).join('')===word){p.streak=(p.streak||0)+1;p.bestStreak=Math.max(p.bestStreak||0,p.streak);feedback=p.streak>=3?'Amazing! '+p.streak+' in a row! ⭐':'Great job! You got it! 🎉';feedbackType='good';playEffect('good');if(!p.done.includes(word))p.done.push(word);save()}else{p.streak=0;save();feedback='Almost! Try moving some letters. You can hear it again.';feedbackType='try';playEffect('try')}render()};actions.append(undo,check);area.append(actions);let msg=document.createElement('p');msg.className='feedback '+feedbackType;msg.setAttribute('role','status');msg.textContent=feedback;area.append(msg)}
$('restart').onclick=()=>{current().done=[];current().streak=0;index=0;save();resetWord()};resetWord();</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
