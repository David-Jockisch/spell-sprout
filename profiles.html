<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profiles · Learning Garden</title><link rel="stylesheet" href="shared.css"><meta name="theme-color" content="#5747c8"></head><body><main class="shell"><header class="top"><div class="brand"><i>🌼</i> Learning Garden</div><a class="pill" href="parents.html">← Grown-ups home</a></header><nav class="settingsNav" aria-label="Grown-up sections"><a class="active" aria-current="page" href="profiles.html">👥 Profiles</a><a href="grownups.html">🌱 Spelling</a><a href="math-settings.html">🔢 Math</a><a href="grammar-settings.html">✏️ Grammar</a></nav><div class="hero"><div class="eyebrow">For grown-ups</div><h1>Manage profiles</h1><p class="muted">Add a learner, change a name, or remove a profile here.</p></div><section class="card"><h2>Learners</h2><div id="rows"></div><div class="row"><input id="name" class="field" style="flex:1" maxlength="28" placeholder="New learner’s name"><button id="add" class="secondary">Add learner</button></div></section><script src="common.js"></script><script>
function render(){let rows=document.getElementById('rows');rows.replaceChildren();data.profiles.forEach(p=>{let row=document.createElement('div');row.className='row';row.style.marginBottom='10px';let name=document.createElement('input');name.className='field';name.style.flex='1';name.value=p.name;name.setAttribute('aria-label','Name for '+p.name);name.onchange=()=>{p.name=name.value.trim()||p.name;save();render()};let del=document.createElement('button');del.className='secondary';del.textContent='Remove';del.disabled=data.profiles.length===1;del.onclick=()=>{if(!confirm('Remove '+p.name+' and their subject progress?'))return;data.profiles=data.profiles.filter(x=>x.id!==p.id);if(data.active===p.id)data.active=data.profiles[0].id;save();render()};row.append(name,del);rows.append(row)})}
document.getElementById('add').onclick=()=>{let input=document.getElementById('name');if(!input.value.trim())return;let p={id:'p'+Date.now(),name:input.value.trim(),words:[],done:[]};data.profiles.push(p);data.active=p.id;input.value='';save();render()};render();</script><div class="footer">Learning Garden · Keep growing</div></main></body></html>
